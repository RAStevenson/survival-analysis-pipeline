# Instructions for GitHub's build robot.
#
# On every push, GitHub rents a fresh Linux machine, runs the steps below on
# it, then throws the machine away. The result shows on the repository page as
# a green check or a red X.
#
# Why this exists here rather than as decoration. The numbers in reports/ were
# once specific to the machine that produced them: XGBoost's histogram
# algorithm sums gradients per thread, so the thread count set the
# floating-point summation order and every published figure quietly depended
# on this desktop's core count. That is fixed and pinned, and verified on this
# machine. But "verified on the machine that produced them" cannot answer
# whether they hold anywhere else. This job is the second machine: different
# operating system, different processor, two cores instead of thirty-two.

name: tests and reproducibility

on:
  push:
  pull_request:
  workflow_dispatch: # puts a "Run workflow" button on the Actions tab

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the repository
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the pinned dependencies
        run: pip install -r requirements.txt

      # Deliberately no `pip install -e .` here. Leaving the package
      # uninstalled forces the src-path bootstrap in scripts/ and
      # tests/conftest.py to do the work, which is what a fresh clone actually
      # does. A development checkout usually has an editable install, and that
      # hides a broken bootstrap because the package imports either way.
      - name: Run the test suite
        run: pytest -q

      # Set aside first, because the run below writes over the committed run
      # folder. Comparing the regenerated file against the checkout's own
      # committed one is the exact question: do these published numbers hold
      # on a machine that did not produce them?
      - name: Set aside the committed metrics
        run: git show HEAD:reports/synthetic/metrics.json > /tmp/committed_metrics.json

      - name: Regenerate the synthetic run
        run: python scripts/run_synthetic_pipeline.py --no-report

      - name: Compare against the committed numbers
        run: >
          python scripts/run_check_reproducibility.py
          /tmp/committed_metrics.json reports/synthetic/metrics.json

      # On failure, keep the regenerated file so the deviation can be
      # diagnosed from the exact values this runner produced.
      - name: Keep the regenerated metrics for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: metrics_ci
          path: reports/synthetic/metrics.json
