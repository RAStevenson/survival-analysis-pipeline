[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "survival-analysis-pipeline"
version = "0.1.0"
description = "Survival analysis pipeline for right-censored duration CSVs: temporal cross-validation, two fitted models, and a generated report"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lifelines>=0.28",
    "shap>=0.44",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "pandas-stubs>=3.0", "pyright>=1.1.400"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# Type checking in pyright's basic mode. Pylance, the checker inside VS Code,
# reads this section too, so an editor shows the same findings. pandas-stubs is pinned in
# requirements.txt so pandas calls resolve. A finding is fixed with explicit
# code; an ignore comment is used only where a library's own typing is wrong,
# and says so.
include = ["src", "scripts", "tests"]
extraPaths = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
